[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clauselens"
version = "0.1.0"
description = "Config-driven clause retrieval research harness over LegalBench-RAG (CUAD-mini)"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# Dense retrieval + reranking. Heavy; install only when needed.
ml = [
    "torch>=2.4",
    "sentence-transformers>=3.0",
    "transformers>=4.42",
]
app = ["streamlit>=1.36"]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
